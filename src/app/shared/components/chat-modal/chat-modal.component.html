<ion-header class="chat-header">
  <ion-toolbar>
    <ion-title class="chat-username">Chat con {{ receiverName }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="chat-content" [fullscreen]="true">
  <div #messagesContainer class="messages-container">

    <div class="chat-info-message">
      Este es un chat privado con el profesional. Toda la información compartida es confidencial.
    </div>

    <ng-container *ngFor="let group of groupedMessages">
      <div class="date-separator"><span>
          {{ formatDateLabel(group.date) }}
        </span></div>

      <div *ngFor="let message of group.messages" [ngClass]="{
             'own-message': message.sender_uid === senderUid,
             'other-message': message.sender_uid !== senderUid
           }" class="message-bubble animate-message">

        <div class="message-text">{{ message.message }}</div>

        <div [ngClass]="{
          'own-message-time': message.sender_uid === senderUid,
          'other-message-time': message.sender_uid !== senderUid
        }">
          {{ message.timestamp | date: 'shortTime' }}
          <ng-container *ngIf="message.sender_uid === senderUid">
            <span class="check-icon">{{ message.seen ? '✔✔' : '✔' }}</span>
          </ng-container>
        </div>

      </div>
    </ng-container>

  </div>
</ion-content>


<ion-footer class="chat-footer">
  <ion-toolbar>
    <ion-item lines="none">
      <ion-input [(ngModel)]="messageText" placeholder="Escribe un mensaje..." class="message-input">
      </ion-input>
      <ion-button class="send-button" fill="solid" slot="end" (click)="sendMessage()" [disabled]="!messageText.trim()">
        Enviar
      </ion-button>
    </ion-item>
  </ion-toolbar>
</ion-footer>
