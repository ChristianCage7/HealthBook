<app-header title="Mi perfil" [showBackButton]="false"></app-header>

<ion-content>
  <div class="profile-container" style="display: flex; flex-direction: column; align-items: center; padding: 1rem;">
    
    <ion-avatar class="avatar-circle" style="width: 120px; height: 120px; margin-bottom: 1rem;">
      <img [src]="user.imgprofile || 'assets/icon/profile-img.png'" alt="Avatar">
    </ion-avatar>

    <ion-card style="width: 100%; max-width: 500px;">
      <ion-card-header>
        <ion-card-title>{{ user.first_name }} {{ user.last_name }}</ion-card-title>
        <ion-card-subtitle>{{ user.email }}</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <p><strong>Fecha de nacimiento:</strong> {{ user.datebirth | date:'longDate' }}</p>
        <p><strong>Género:</strong> {{ user.gender?.name || 'No especificado' }}</p>
        <p *ngIf="user.profession"><strong>Profesión:</strong> {{ user.profession.name }}</p>
      </ion-card-content>
    </ion-card>

    <ion-button expand="block" color="primary" (click)="confirmChangePassword()">
      Cambiar contraseña
    </ion-button>

    <ion-button expand="block" color="danger" disabled>
      Eliminar mi cuenta
    </ion-button>
  </div>
</ion-content>
