<app-header title="Videollamada"></app-header>

<ion-content class="ion-padding">
  <div class="video-container">
    <div class="video-wrapper">
      <video id="publisher" autoplay muted playsinline></video>
      <div class="label">{{ localLabel }}</div>
    </div>

    <div class="video-wrapper" *ngFor="let sub of subscribers">
      <video #remoteVideo autoplay playsinline></video>
      <div class="label">{{ remoteLabel }}</div>
    </div>
  </div>
</ion-content>
