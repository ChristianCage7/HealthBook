<app-header [showBackButton]="false" title="Sesiones"></app-header>

<ion-content class="ion-padding page-content">
  <ion-button expand="block" class="btn-primary floating-button" (click)="goToManageAvailability()">
    Subir disponibilidad
  </ion-button>

  <!-- Aquí se pueden agregar cards de citas si más adelante lo deseas -->

  <!-- Botón fijo para iniciar la videollamada real -->
  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button color="tertiary" (click)="iniciarCitaDesdeBase()">
      <ion-icon name="videocam-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
