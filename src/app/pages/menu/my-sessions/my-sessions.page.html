<app-header [showBackButton]="false" title="Mis citas"></app-header>

<ion-content class="ion-padding">
  <ng-template [ngIf]="!loading" [ngIfElse]="loadingTpl">
    <ion-card *ngFor="let appt of appointments">
      <ion-card-header>
        <ion-card-title>
          {{ appt.professionalName ? appt.professionalName : 'Profesional' }}
        </ion-card-title>
        <ion-card-subtitle>
          {{ appt.appointmentDate | date: 'fullDate' }} a las {{ appt.appointmentTime?.substring(0, 5) }}
        </ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <p>
          <strong>Estado:</strong>
          <span [style.color]="appt.status === 1 ? 'green' : 'red'">
            {{ appt.status === 1 ? 'Activa' : 'Cancelada' }}
          </span>
        </p>

        <ion-button expand="block" class="video-call-button" (click)="iniciarLlamada(appt)">
          Iniciar Videollamada
        </ion-button>
      </ion-card-content>
    </ion-card>

    <ion-item *ngIf="appointments.length === 0">
      <ion-label>No tienes citas agendadas.</ion-label>
    </ion-item>
  </ng-template>

  <ng-template #loadingTpl>
    <ion-spinner name="crescent"></ion-spinner>
  </ng-template>
</ion-content>
