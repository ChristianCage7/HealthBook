<ion-header>
  <ion-toolbar>
    <ion-title>{{ isProfessional ? 'Disponibilidad' : 'Calendario de Citas' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openDynamicModal()">
        {{ isProfessional ? 'Agregar' : 'Nueva Cita' }}
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <mwl-calendar-month-view
    [viewDate]="viewDate"
    [events]="events"
    (eventClicked)="openDynamicModal()">
  </mwl-calendar-month-view>
</ion-content>
