<ion-content class="ion-padding ion-text-center">
  <ng-container *ngIf="loading">
    <ion-spinner></ion-spinner>
    <p>Confirmando tu cuenta...</p>
  </ng-container>

  <ng-container *ngIf="!loading && confirmed">
    <h2>✅ Correo confirmado</h2>
    <p>Redirigiendo al login...</p>
  </ng-container>

  <ng-container *ngIf="!loading && !confirmed">
    <h2>❌ Error al confirmar</h2>
    <p>El link puede haber expirado o ya fue usado.</p>
    <ion-button routerLink="/auth">Ir al login</ion-button>
  </ng-container>
</ion-content>
